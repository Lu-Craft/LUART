<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUART | Secure Authentication</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luart: { 50: '#fff5ed', 100: '#ffe8d4', 500: '#ff6600', 600: '#e65c00', 900: '#7a3100' },
                        dark: { 800: '#0f0f11', 900: '#0a0a0b', 950: '#050505' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(10, 10, 11, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .text-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #ff6600;
            background: rgba(255, 102, 0, 0.05);
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.1);
        }

        .bg-mesh {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(at 0% 0%, rgba(255, 102, 0, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 102, 0, 0.1) 0px, transparent 50%);
            z-index: -1;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center relative">

    <!-- Background Elements -->
    <div class="bg-mesh"></div>
    <div
        class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 pointer-events-none mix-blend-overlay">
    </div>

    <!-- Main Auth Card -->
    <main class="w-full max-w-md p-6 relative z-10">

        <!-- Logo -->
        <div class="text-center mb-10">
            <a href="index.html" class="inline-block transition-transform hover:scale-105">
                <h1 class="text-3xl font-display font-bold text-white tracking-widest">LUART<span
                        class="text-luart-500">.</span></h1>
            </a>
        </div>

        <div class="glass-card rounded-2xl p-8 relative overflow-hidden">
            <!-- Decorative accent line -->
            <div
                class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-luart-500 to-transparent opacity-50">
            </div>

            <div class="text-center mb-8">
                <h2 id="auth-title" class="text-2xl font-display font-bold text-white mb-2">Access Terminal</h2>
                <p id="auth-subtitle" class="text-sm text-gray-400">Secure connection required</p>
            </div>

            <form id="authForm" class="space-y-5">
                <div id="name-group" class="space-y-2 hidden">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Full Name</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="text" id="auth-name" class="input-field w-full rounded-lg py-3 pl-10 pr-4 text-sm"
                            placeholder="John Doe">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Secure Email</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="email" id="auth-email" required
                            class="input-field w-full rounded-lg py-3 pl-10 pr-4 text-sm" placeholder="you@company.com">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Access Token</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="password" id="auth-password" required minlength="6"
                            class="input-field w-full rounded-lg py-3 pl-10 pr-4 text-sm" placeholder="••••••••">
                    </div>
                </div>

                <div id="auth-error"
                    class="hidden text-red-400 text-xs font-medium text-center bg-red-500/10 border border-red-500/20 rounded py-2">
                </div>

                <button type="submit"
                    class="w-full bg-white text-black hover:bg-luart-100 font-display font-semibold py-3 px-4 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 mt-2 group">
                    <span id="auth-btn-text">Authenticate</span>
                    <i class="fas fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="#" id="toggle-auth-mode"
                    class="text-xs text-gray-500 hover:text-white transition-colors border-b border-transparent hover:border-white pb-0.5">
                    REQUEST NEW PROTOCOL (REGISTER)
                </a>
            </div>
        </div>

        <div class="mt-8 text-center">
            <p class="text-[10px] text-gray-600 font-mono uppercase tracking-widest">System secured by Supabase Cloud
                Core 256-bit</p>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js?v=9"></script>
    <script src="login.js?v=9"></script>
</body>

</html>
